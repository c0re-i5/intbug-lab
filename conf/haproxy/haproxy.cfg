# HAProxy 3.0 lab target. Published only as 127.0.0.1:19453.
# Single container: TLS + ALPN h2, static body via http-request return
# (no second backend). Traefik was not selected.
# Image tag :3.0-alpine is HAProxy 3.0.31 LTS. Digest is pinned in
# docker-compose.yml, ours/targets.py, and scripts/lab-up-targets.sh.
# Cert PEM is lab.crt followed by lab.key; the entrypoint concatenates them.
global
    log stdout format raw local0
    maxconn 256
    tune.ssl.default-dh-param 2048

defaults
    mode http
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    log global

frontend lab_https
    bind :443 ssl crt /etc/haproxy/certs/lab.pem alpn h2,http/1.1
    # Serve the same 896-byte index without a backend.
    # This does not implement Range and does not proxy a real stream lifecycle.
    # 3.0.31 rejects a trailing backslash as line continuation, so this rule
    # is one line (same directive as the draft stub).
    http-request return status 200 content-type "text/html; charset=utf-8" file /etc/haproxy/www/index.html if { path / } || { path /index.html }
    http-request deny deny_status 404
