# OpenResty lab target. Same listen shape as conf/nginx.conf.
# Prefix paths are OpenResty's (/usr/local/openresty/nginx), not stock nginx.
# Image: openresty/1.31.8.1, still the nginx 1.31.8 line.
worker_processes 4;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate /tmp/lab-h2.crt;
        ssl_certificate_key /tmp/lab-h2.key;

        root /usr/local/openresty/nginx/html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
