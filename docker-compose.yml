# Loopback-only lab targets for the HTTP/2 flow-control battery.
# Never change binds to 0.0.0.0.
# Digests must match ours/targets.py and scripts/lab-up-targets.sh.
services:
  nginx-1318:
    image: nginx@sha256:5ab5b0b01097420873a3f3330f44248e34a3c2a3e8d5ee30658aeae8cb7435da
    platform: linux/amd64
    container_name: integer-lab-nginx-1318
    ports: ["127.0.0.1:19443:443"]
    volumes: ["./conf/nginx.conf:/etc/nginx/nginx.conf:ro"]
    entrypoint: ["sh","-c","openssl req -x509 -newkey rsa:2048 -nodes -days 30 -keyout /tmp/nginx-h2.key -out /tmp/nginx-h2.crt -subj /CN=localhost -addext subjectAltName=DNS:localhost,IP:127.0.0.1 && exec nginx -g 'daemon off;'"]

  nginx-http2-off:
    image: nginx@sha256:5ab5b0b01097420873a3f3330f44248e34a3c2a3e8d5ee30658aeae8cb7435da
    platform: linux/amd64
    container_name: integer-lab-nginx-neg
    ports: ["127.0.0.1:19444:443"]
    volumes: ["./conf/nginx-http2-off.conf:/etc/nginx/nginx.conf:ro"]
    entrypoint: ["sh","-c","openssl req -x509 -newkey rsa:2048 -nodes -days 30 -keyout /tmp/nginx-h2.key -out /tmp/nginx-h2.crt -subj /CN=localhost -addext subjectAltName=DNS:localhost,IP:127.0.0.1 && exec nginx -g 'daemon off;'"]

  httpd-2471:
    image: httpd@sha256:32e9403360ab2f1047523e72f256527fb9aee68b342abf6ad03f0d629157f3d9
    platform: linux/amd64
    container_name: integer-lab-httpd
    ports: ["127.0.0.1:19445:443"]
    volumes:
      - ./conf/apache/htdocs:/usr/local/apache2/htdocs-lab:ro
      - ./conf/apache/entrypoint.sh:/entrypoint-lab.sh:ro
    entrypoint: ["sh","/entrypoint-lab.sh"]

  nginx-1319:
    image: nginx@sha256:08f354a3b44c422021a5c0f5efb3e27f8f90236b5447d3bac4053f5f50ab6760
    platform: linux/amd64
    container_name: integer-lab-nginx-1319
    ports: ["127.0.0.1:19446:443"]
    volumes: ["./conf/nginx.conf:/etc/nginx/nginx.conf:ro"]
    entrypoint: ["sh","-c","openssl req -x509 -newkey rsa:2048 -nodes -days 30 -keyout /tmp/nginx-h2.key -out /tmp/nginx-h2.crt -subj /CN=localhost -addext subjectAltName=DNS:localhost,IP:127.0.0.1 && exec nginx -g 'daemon off;'"]

  caddy-210:
    image: caddy@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    platform: linux/amd64
    container_name: integer-lab-caddy
    ports: ["127.0.0.1:19447:443"]
    volumes:
      - ./conf/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./conf/shared/index.html:/srv/index.html:ro
      - ./certs/lab.crt:/certs/lab.crt:ro
      - ./certs/lab.key:/certs/lab.key:ro

  envoy-132:
    image: envoyproxy/envoy@sha256:6bf0d37dd5e8eac4b37effe89a1aec4760f7f2ce860d1fd6af22147eb87a5058
    platform: linux/amd64
    container_name: integer-lab-envoy
    ports: ["127.0.0.1:19448:10000"]
    volumes:
      - ./conf/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./certs/lab.crt:/certs/lab.crt:ro
      - ./certs/lab.key:/certs/lab.key:ro
    command: ["-c", "/etc/envoy/envoy.yaml"]

  # go-nethttp, nghttpd, and node-http2 are built locally (see
  # scripts/lab-up-targets.sh); compose entries below assume the tagged
  # images already exist.
  go-nethttp:
    image: integer-lab-go:pinned
    platform: linux/amd64
    container_name: integer-lab-go
    ports: ["127.0.0.1:19449:443"]

  nghttpd:
    image: integer-lab-nghttpd:pinned
    platform: linux/amd64
    container_name: integer-lab-nghttpd
    ports: ["127.0.0.1:19450:443"]

  # OpenResty 1.31.8.1 is still the nginx 1.31.8 line. A cleanup_overcredit
  # FAIL here is inheritance of CVE-2026-123007, not a new CVE.
  openresty-13181:
    image: openresty/openresty@sha256:2cb90d64192934c26b3749cf744f47edd59277787fe761bd109eeebdc3e2214a
    platform: linux/amd64
    container_name: integer-lab-openresty
    ports: ["127.0.0.1:19452:443"]
    volumes:
      - ./conf/openresty/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./conf/shared/index.html:/usr/local/openresty/nginx/html/index.html:ro
    # Alpine image has no openssl CLI; install it, then the same self-signed
    # cert command as nginx-1318. The server bits stay the pinned digest.
    entrypoint: ["sh","-c","apk add --no-cache openssl >/dev/null && openssl req -x509 -newkey rsa:2048 -nodes -days 30 -keyout /tmp/lab-h2.key -out /tmp/lab-h2.crt -subj /CN=localhost -addext subjectAltName=DNS:localhost,IP:127.0.0.1 && exec openresty -g 'daemon off;'"]

  # HAProxy 3.0.31 LTS (:3.0-alpine). Single container: TLS+ALPN h2 and
  # http-request return file (no second backend). Entrypoint concatenates
  # lab.crt+lab.key into the PEM HAProxy loads. The image USER is haproxy;
  # this service runs as root so that PEM can be written under /etc/haproxy.
  # return-file does not implement Range. Traefik was not selected.
  # Digest must match ours/targets.py and scripts/lab-up-targets.sh.
  haproxy-30:
    image: haproxy@sha256:7430e63d3052198b18a40665b59a5826bc428e8bceb0c561d82258149ef855ee
    platform: linux/amd64
    container_name: integer-lab-haproxy
    user: "0:0"
    ports: ["127.0.0.1:19453:443"]
    volumes:
      - ./conf/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./conf/haproxy/entrypoint.sh:/entrypoint-lab.sh:ro
      - ./conf/shared/index.html:/etc/haproxy/www/index.html:ro
      - ./certs/lab.crt:/certs/lab.crt:ro
      - ./certs/lab.key:/certs/lab.key:ro
    entrypoint: ["sh", "/entrypoint-lab.sh"]

  # OpenLiteSpeed 1.9.4 Open — open source OLS, not commercial LSWS
  # Enterprise (litespeedtech/litespeed needs a license; do not use it).
  # Publish only 127.0.0.1:19451 → container 443. Do not publish WebAdmin
  # 7080. The image EXPOSE metadata still lists 7080; the entrypoint sets
  # disableWebAdmin 1 and this service has no 7080 host bind.
  # Entrypoint patches the HTTPS listener (lab cert, enableSpdy 8) and the
  # docker vhost vhssl, then starts OLS. Docroot is the shared index.html.
  # Image is the lsphp build (unpacked about 726 MiB here).
  # Digest must match ours/targets.py and scripts/lab-up-targets.sh.
  openlitespeed-194:
    image: litespeedtech/openlitespeed@sha256:48bc2719f24c4a451f13c379f499e9822f00aeae9ed248fea6d934d4a4231d50
    platform: linux/amd64
    container_name: integer-lab-openlitespeed
    ports: ["127.0.0.1:19451:443"]
    volumes:
      - ./conf/openlitespeed/:/ols-lab:ro
      - ./conf/shared/index.html:/var/www/vhosts/localhost/html/index.html:ro
      - ./certs/lab.crt:/certs/lab.crt:ro
      - ./certs/lab.key:/certs/lab.key:ro
    entrypoint: ["sh", "/ols-lab/entrypoint.sh"]

  # node-http2 is built locally from
  # node@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a
  # (tag :22-alpine → v22.23.5). Image tag after build: integer-lab-node:pinned.
  node-http2:
    image: integer-lab-node:pinned
    platform: linux/amd64
    container_name: integer-lab-node
    ports: ["127.0.0.1:19454:443"]
    volumes:
      - ./certs/lab.crt:/certs/lab.crt:ro
      - ./certs/lab.key:/certs/lab.key:ro
